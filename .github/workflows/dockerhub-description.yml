# Syncs DOCKERHUB.md to the Docker Hub repository overview whenever it changes on main.
# Needs the secret DOCKERHUB_DESCRIPTION_TOKEN: a Docker Hub personal access token with
# "Read, Write, Delete" scope (Docker Hub requires it to change repository descriptions).
name: Docker Hub Description

on:
  push:
    branches: [main]
    paths:
      - DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'denisw160/hello-world-vaadin' }}

jobs:
  update-description:
    name: Update Docker Hub overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKERHUB.md
          short-description: Minimal Vaadin 25 Hello World app (Java 25, Spring Boot 4) - multi-arch, non-root, health check
