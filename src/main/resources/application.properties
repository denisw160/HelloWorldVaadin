# ***************************************************************************
# * Default application properties                                          *
# ***************************************************************************
# Spring configuration
spring.application.name=hello-world-vaadin
server.port=${PORT:8080}

# Don't open a browser window on startup (also keeps tests from opening one)
vaadin.launch-browser=false

# Only scan these packages for Vaadin routes and components (faster startup)
# See https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,me.wirries.sample

# Health check endpoint for Docker and container platforms: /actuator/health
# (plus /actuator/health/liveness and /actuator/health/readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
